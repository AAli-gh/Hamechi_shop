kind = "web"
previewPath = "/"
title = "کودک‌لند — فروشگاه کودک"
version = "1.0.0"
id = "artifacts/koodakland"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22903

[services.development]
run = "pnpm --filter @workspace/koodakland run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/koodakland", "run", "build" ]
publicDir = "artifacts/koodakland/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22903"
BASE_PATH = "/"
