openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Bazarcheh general store API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product operations
  - name: categories
    description: Category operations
  - name: cart
    description: Cart operations
  - name: orders
    description: Order operations
  - name: users
    description: User operations
  - name: wishlist
    description: Wishlist operations
  - name: reviews
    description: Review operations
  - name: blog
    description: Blog operations
  - name: banners
    description: Banner operations
  - name: discounts
    description: Discount operations
  - name: admin
    description: Admin operations
  - name: search
    description: Search operations
  - name: shipping
    description: Shipping operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Products
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products with filters
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: sort
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
        - name: inStock
          in: query
          schema: { type: boolean }
        - name: featured
          in: query
          schema: { type: boolean }
        - name: flashSale
          in: query
          schema: { type: boolean }
        - name: ageGroup
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a new product (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/featured:
    get:
      operationId: getFeaturedProducts
      tags: [products]
      summary: Get featured products
      responses:
        "200":
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/flash-sale:
    get:
      operationId: getFlashSaleProducts
      tags: [products]
      summary: Get flash sale products
      responses:
        "200":
          description: Flash sale products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/new-arrivals:
    get:
      operationId: getNewArrivals
      tags: [products]
      summary: Get new arrival products
      responses:
        "200":
          description: New arrivals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/best-sellers:
    get:
      operationId: getBestSellers
      tags: [products]
      summary: Get best seller products
      responses:
        "200":
          description: Best sellers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/slug/{slug}:
    get:
      operationId: getProductBySlug
      tags: [products]
      summary: Get product by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}/variants:
    put:
      operationId: setProductVariants
      tags: [products]
      summary: Replace a product's variants (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductVariantsInput"
      responses:
        "200":
          description: Product with its new variants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update product (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete product (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /products/{id}/related:
    get:
      operationId: getRelatedProducts
      tags: [products]
      summary: Get related products
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Related products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  # Categories
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create category (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update category (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete category (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # Search
  /search:
    get:
      operationId: searchProducts
      tags: [search]
      summary: Search products (live search dropdown)
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"

  # Cart
  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get current cart
      parameters:
        - name: sessionId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    post:
      operationId: addToCart
      tags: [cart]
      summary: Add item to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemInput"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /cart/{itemId}:
    patch:
      operationId: updateCartItem
      tags: [cart]
      summary: Update cart item quantity
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
        - name: sessionId
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemUpdate"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    delete:
      operationId: removeCartItem
      tags: [cart]
      summary: Remove item from cart
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
        - name: sessionId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  # Wishlist
  /wishlist:
    get:
      operationId: getWishlist
      tags: [wishlist]
      summary: Get wishlist
      parameters:
        - name: userId
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Wishlist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WishlistItem"
    post:
      operationId: addToWishlist
      tags: [wishlist]
      summary: Add product to wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WishlistInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistItem"

  /wishlist/{productId}:
    delete:
      operationId: removeFromWishlist
      tags: [wishlist]
      summary: Remove from wishlist
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Removed

  # Orders
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders (admin or user's own)
      parameters:
        - name: userId
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place an order (checkout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Update order status / tracking (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  # Reviews
  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List reviews for a product
      parameters:
        - name: productId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Created review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  # Users / Auth
  /auth/register:
    post:
      operationId: registerUser
      tags: [users]
      summary: Register with mobile number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      operationId: loginUser
      tags: [users]
      summary: Login with mobile and OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Auth token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/send-otp:
    post:
      operationId: sendOtp
      tags: [users]
      summary: Send OTP to mobile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpInput"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpResponse"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user profile
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user profile
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/addresses:
    get:
      operationId: getUserAddresses
      tags: [users]
      summary: Get user addresses
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Address"
    post:
      operationId: addUserAddress
      tags: [users]
      summary: Add user address
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "201":
          description: Added address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"

  # Blog
  /blog/posts:
    get:
      operationId: listBlogPosts
      tags: [blog]
      summary: List blog posts
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
        - name: published
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Blog posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPostListResponse"
    post:
      operationId: createBlogPost
      tags: [blog]
      summary: Create blog post (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogPostInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"

  /blog/posts/{slug}:
    get:
      operationId: getBlogPost
      tags: [blog]
      summary: Get blog post by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Blog post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
    patch:
      operationId: updateBlogPost
      tags: [blog]
      summary: Update blog post (admin)
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogPostUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
    delete:
      operationId: deleteBlogPost
      tags: [blog]
      summary: Delete blog post (admin)
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /blog/categories:
    get:
      operationId: listBlogCategories
      tags: [blog]
      summary: List blog categories
      responses:
        "200":
          description: Blog categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlogCategory"

  # Banners
  /banners:
    get:
      operationId: listBanners
      tags: [banners]
      summary: List active banners
      responses:
        "200":
          description: Banners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Banner"
    post:
      operationId: createBanner
      tags: [banners]
      summary: Create banner (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BannerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Banner"

  /banners/{id}:
    patch:
      operationId: updateBanner
      tags: [banners]
      summary: Update banner (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BannerInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Banner"
    delete:
      operationId: deleteBanner
      tags: [banners]
      summary: Delete banner (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # Discounts
  /discounts/validate:
    post:
      operationId: validateDiscount
      tags: [discounts]
      summary: Validate a discount code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountValidateInput"
      responses:
        "200":
          description: Discount info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscountValidateResponse"

  /discounts:
    get:
      operationId: listDiscounts
      tags: [discounts]
      summary: List discounts (admin)
      responses:
        "200":
          description: Discounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Discount"
    post:
      operationId: createDiscount
      tags: [discounts]
      summary: Create discount (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discount"

  /discounts/{id}:
    delete:
      operationId: deleteDiscount
      tags: [discounts]
      summary: Delete discount (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # Admin Dashboard Stats
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin dashboard statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/recent-orders:
    get:
      operationId: getRecentOrders
      tags: [admin]
      summary: Get recent orders for dashboard
      responses:
        "200":
          description: Recent orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /admin/low-stock:
    get:
      operationId: getLowStockProducts
      tags: [admin]
      summary: Get low stock products
      responses:
        "200":
          description: Low stock
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /admin/sales-chart:
    get:
      operationId: getSalesChart
      tags: [admin]
      summary: Get sales chart data (last 30 days)
      responses:
        "200":
          description: Sales chart
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalesChartPoint"

  # Shipping
  /shipping/track/{trackingCode}:
    get:
      operationId: trackShipment
      tags: [shipping]
      summary: Track shipment by code
      parameters:
        - name: trackingCode
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Tracking info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingInfo"

  /shipping/methods:
    get:
      operationId: listShippingMethods
      tags: [shipping]
      summary: List shipping methods
      responses:
        "200":
          description: Shipping methods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShippingMethod"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    # Product schemas
    Product:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        nameFa: { type: string }
        slug: { type: string }
        description: { type: ["string", "null"] }
        descriptionFa: { type: ["string", "null"] }
        price: { type: number }
        salePrice: { type: ["number", "null"] }
        images: { type: array, items: { type: string } }
        categoryId: { type: integer }
        categoryName: { type: ["string", "null"] }
        stock: { type: integer }
        sku: { type: ["string", "null"] }
        brand: { type: ["string", "null"] }
        ageGroup: { type: ["string", "null"] }
        weight: { type: ["number", "null"] }
        tags: { type: array, items: { type: string } }
        isFeatured: { type: boolean }
        isFlashSale: { type: boolean }
        flashSaleEndsAt: { type: ["string", "null"] }
        avgRating: { type: ["number", "null"] }
        reviewCount: { type: integer }
        createdAt: { type: string }
        variants: { type: array, items: { $ref: "#/components/schemas/ProductVariant" } }
      required: [id, name, nameFa, slug, price, images, categoryId, stock, isFeatured, isFlashSale, reviewCount, createdAt, variants]

    ProductVariant:
      type: object
      description: A purchasable version of a product, e.g. a color and size.
      properties:
        id: { type: integer }
        options:
          type: array
          items: { $ref: "#/components/schemas/VariantOption" }
          description: Ordered option values, e.g. رنگ=مشکی then سایز=۴۲
        label: { type: string, description: 'Option values joined with " / "' }
        sku: { type: ["string", "null"] }
        price: { type: number, description: Effective regular price (own price or the product's) }
        salePrice: { type: ["number", "null"] }
        ownPrice: { type: ["number", "null"], description: "Price stored on the variant; null means it inherits the product's prices" }
        ownSalePrice: { type: ["number", "null"] }
        stock: { type: integer }
      required: [id, options, label, price, stock, ownPrice, ownSalePrice]

    VariantOption:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 30 }
        value: { type: string, minLength: 1, maxLength: 50 }
      required: [name, value]

    ProductVariantInput:
      type: object
      properties:
        id: { type: ["integer", "null"], description: Existing variant to update; omit to create }
        options:
          type: array
          items: { $ref: "#/components/schemas/VariantOption" }
          minItems: 1
          maxItems: 3
        sku: { type: ["string", "null"] }
        price: { type: ["number", "null"], description: Overrides the product price when set }
        salePrice: { type: ["number", "null"] }
        stock: { type: integer, minimum: 0 }
      required: [options, stock]

    ProductVariantsInput:
      type: object
      properties:
        variants: { type: array, items: { $ref: "#/components/schemas/ProductVariantInput" }, maxItems: 100 }
      required: [variants]

    ProductInput:
      type: object
      properties:
        name: { type: string }
        nameFa: { type: string }
        slug: { type: string }
        description: { type: string }
        descriptionFa: { type: string }
        price: { type: number }
        salePrice: { type: ["number", "null"] }
        images: { type: array, items: { type: string } }
        categoryId: { type: integer }
        stock: { type: integer }
        sku: { type: string }
        brand: { type: string }
        ageGroup: { type: string }
        weight: { type: number }
        tags: { type: array, items: { type: string } }
        isFeatured: { type: boolean }
        isFlashSale: { type: boolean }
        flashSaleEndsAt: { type: ["string", "null"] }
      required: [name, nameFa, slug, price, images, categoryId, stock]

    ProductUpdate:
      type: object
      properties:
        name: { type: string }
        nameFa: { type: string }
        description: { type: string }
        descriptionFa: { type: string }
        price: { type: number }
        salePrice: { type: ["number", "null"] }
        images: { type: array, items: { type: string } }
        categoryId: { type: integer }
        stock: { type: integer }
        sku: { type: string }
        brand: { type: string }
        ageGroup: { type: string }
        isFeatured: { type: boolean }
        isFlashSale: { type: boolean }
        flashSaleEndsAt: { type: ["string", "null"] }

    ProductListResponse:
      type: object
      properties:
        products: { type: array, items: { $ref: "#/components/schemas/Product" } }
        total: { type: integer }
        page: { type: integer }
        totalPages: { type: integer }
      required: [products, total, page, totalPages]

    # Category schemas
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        nameFa: { type: string }
        slug: { type: string }
        icon: { type: ["string", "null"] }
        image: { type: ["string", "null"] }
        parentId: { type: ["integer", "null"] }
        productCount: { type: integer }
        color: { type: ["string", "null"] }
      required: [id, name, nameFa, slug, productCount]

    CategoryInput:
      type: object
      properties:
        name: { type: string }
        nameFa: { type: string }
        slug: { type: string }
        icon: { type: string }
        image: { type: string }
        parentId: { type: ["integer", "null"] }
        color: { type: string }
      required: [name, nameFa, slug]

    # Search
    SearchResponse:
      type: object
      properties:
        products: { type: array, items: { $ref: "#/components/schemas/Product" } }
        categories: { type: array, items: { $ref: "#/components/schemas/Category" } }
        total: { type: integer }
      required: [products, categories, total]

    # Cart schemas
    CartItem:
      type: object
      properties:
        id: { type: integer }
        productId: { type: integer }
        product: { $ref: "#/components/schemas/Product" }
        variantId: { type: ["integer", "null"] }
        variantLabel: { type: ["string", "null"] }
        availableStock: { type: integer, description: "Stock of the chosen variant, or of the product" }
        quantity: { type: integer }
        price: { type: number }
      required: [id, productId, product, quantity, price, availableStock]

    Cart:
      type: object
      properties:
        id: { type: integer }
        sessionId: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/CartItem" } }
        subtotal: { type: number }
        itemCount: { type: integer }
      required: [id, sessionId, items, subtotal, itemCount]

    CartItemInput:
      type: object
      properties:
        productId: { type: integer }
        variantId: { type: ["integer", "null"], description: Required when the product has variants }
        quantity: { type: integer, minimum: 1, maximum: 20 }
        sessionId: { type: string }
      required: [productId, quantity, sessionId]

    CartItemUpdate:
      type: object
      properties:
        quantity: { type: integer, minimum: 1, maximum: 20 }
      required: [quantity]

    # Wishlist
    WishlistItem:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        productId: { type: integer }
        product: { $ref: "#/components/schemas/Product" }
        createdAt: { type: string }
      required: [id, userId, productId, product, createdAt]

    WishlistInput:
      type: object
      properties:
        userId: { type: integer }
        productId: { type: integer }
      required: [userId, productId]

    # Order schemas
    OrderItem:
      type: object
      properties:
        id: { type: integer }
        productId: { type: integer }
        productName: { type: string }
        variantId: { type: ["integer", "null"] }
        variantName: { type: ["string", "null"] }
        quantity: { type: integer }
        price: { type: number }
        image: { type: ["string", "null"] }
      required: [id, productId, productName, quantity, price]

    Order:
      type: object
      properties:
        id: { type: integer }
        userId: { type: ["integer", "null"] }
        orderNumber: { type: string }
        status: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/OrderItem" } }
        subtotal: { type: number }
        shippingCost: { type: number }
        discount: { type: number }
        total: { type: number }
        addressId: { type: ["integer", "null"] }
        addressSnapshot: { type: ["string", "null"] }
        shippingMethod: { type: ["string", "null"] }
        trackingCode: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
        customerName: { type: ["string", "null"] }
        customerPhone: { type: ["string", "null"] }
      required: [id, orderNumber, status, items, subtotal, shippingCost, discount, total, createdAt, updatedAt]

    OrderInput:
      type: object
      properties:
        sessionId: { type: string }
        userId: { type: ["integer", "null"] }
        addressSnapshot: { type: string }
        shippingMethod: { type: string }
        discountCode: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        customerName: { type: string }
        customerPhone: { type: string }
      required: [sessionId, addressSnapshot, shippingMethod, customerName, customerPhone]

    OrderUpdate:
      type: object
      properties:
        status: { type: string }
        trackingCode: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }

    OrderListResponse:
      type: object
      properties:
        orders: { type: array, items: { $ref: "#/components/schemas/Order" } }
        total: { type: integer }
        page: { type: integer }
        totalPages: { type: integer }
      required: [orders, total, page, totalPages]

    # Review schemas
    Review:
      type: object
      properties:
        id: { type: integer }
        productId: { type: integer }
        userId: { type: ["integer", "null"] }
        authorName: { type: string }
        rating: { type: integer }
        comment: { type: ["string", "null"] }
        isVerified: { type: boolean }
        createdAt: { type: string }
      required: [id, productId, authorName, rating, isVerified, createdAt]

    ReviewInput:
      type: object
      properties:
        productId: { type: integer }
        authorName: { type: string, minLength: 2, maxLength: 60 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 2000 }
      required: [productId, authorName, rating]

    # User / Auth
    User:
      type: object
      properties:
        id: { type: integer }
        mobile: { type: string }
        name: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        avatar: { type: ["string", "null"] }
        role: { type: string }
        createdAt: { type: string }
      required: [id, mobile, role, createdAt]

    UserUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        avatar: { type: string }

    RegisterInput:
      type: object
      properties:
        mobile: { type: string }
        name: { type: string }
        otp: { type: string }
      required: [mobile, otp]

    LoginInput:
      type: object
      properties:
        mobile: { type: string }
        otp: { type: string }
      required: [mobile, otp]

    OtpInput:
      type: object
      properties:
        mobile: { type: string }
      required: [mobile]

    OtpResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        otp: { type: ["string", "null"] }
      required: [success, message]

    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }
      required: [token, user]

    Address:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        label: { type: ["string", "null"] }
        province: { type: string }
        city: { type: string }
        street: { type: string }
        postalCode: { type: string }
        isDefault: { type: boolean }
      required: [id, userId, province, city, street, postalCode, isDefault]

    AddressInput:
      type: object
      properties:
        label: { type: string }
        province: { type: string }
        city: { type: string }
        street: { type: string }
        postalCode: { type: string }
        isDefault: { type: boolean }
      required: [province, city, street, postalCode]

    # Blog schemas
    BlogPost:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        titleFa: { type: string }
        excerpt: { type: ["string", "null"] }
        excerptFa: { type: ["string", "null"] }
        content: { type: string }
        contentFa: { type: string }
        coverImage: { type: ["string", "null"] }
        categoryId: { type: ["integer", "null"] }
        categoryName: { type: ["string", "null"] }
        authorName: { type: string }
        tags: { type: array, items: { type: string } }
        isPublished: { type: boolean }
        readingTime: { type: integer }
        viewCount: { type: integer }
        createdAt: { type: string }
      required: [id, slug, title, titleFa, content, contentFa, authorName, isPublished, readingTime, viewCount, createdAt]

    BlogPostInput:
      type: object
      properties:
        slug: { type: string }
        title: { type: string }
        titleFa: { type: string }
        excerpt: { type: string }
        excerptFa: { type: string }
        content: { type: string }
        contentFa: { type: string }
        coverImage: { type: string }
        categoryId: { type: ["integer", "null"] }
        authorName: { type: string }
        tags: { type: array, items: { type: string } }
        isPublished: { type: boolean }
        readingTime: { type: integer }
      required: [slug, title, titleFa, content, contentFa, authorName]

    BlogPostUpdate:
      type: object
      properties:
        title: { type: string }
        titleFa: { type: string }
        excerpt: { type: string }
        excerptFa: { type: string }
        content: { type: string }
        contentFa: { type: string }
        coverImage: { type: string }
        categoryId: { type: ["integer", "null"] }
        tags: { type: array, items: { type: string } }
        isPublished: { type: boolean }
        readingTime: { type: integer }

    BlogPostListResponse:
      type: object
      properties:
        posts: { type: array, items: { $ref: "#/components/schemas/BlogPost" } }
        total: { type: integer }
        page: { type: integer }
        totalPages: { type: integer }
      required: [posts, total, page, totalPages]

    BlogCategory:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        nameFa: { type: string }
        slug: { type: string }
        postCount: { type: integer }
      required: [id, name, nameFa, slug, postCount]

    # Banner
    Banner:
      type: object
      properties:
        id: { type: integer }
        title: { type: ["string", "null"] }
        titleFa: { type: ["string", "null"] }
        subtitle: { type: ["string", "null"] }
        subtitleFa: { type: ["string", "null"] }
        image: { type: string }
        link: { type: ["string", "null"] }
        position: { type: string }
        isActive: { type: boolean }
        sortOrder: { type: integer }
      required: [id, image, position, isActive, sortOrder]

    BannerInput:
      type: object
      properties:
        title: { type: string }
        titleFa: { type: string }
        subtitle: { type: string }
        subtitleFa: { type: string }
        image: { type: string }
        link: { type: string }
        position: { type: string }
        isActive: { type: boolean }
        sortOrder: { type: integer }
      required: [image, position]

    # Discount
    Discount:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        type: { type: string }
        value: { type: number }
        minOrder: { type: ["number", "null"] }
        maxUses: { type: ["integer", "null"] }
        usedCount: { type: integer }
        expiresAt: { type: ["string", "null"] }
        isActive: { type: boolean }
      required: [id, code, type, value, usedCount, isActive]

    DiscountInput:
      type: object
      properties:
        code: { type: string }
        type: { type: string }
        value: { type: number }
        minOrder: { type: ["number", "null"] }
        maxUses: { type: ["integer", "null"] }
        expiresAt: { type: ["string", "null"] }
        isActive: { type: boolean }
      required: [code, type, value]

    DiscountValidateInput:
      type: object
      properties:
        code: { type: string }
        cartTotal: { type: number }
      required: [code, cartTotal]

    DiscountValidateResponse:
      type: object
      properties:
        valid: { type: boolean }
        discount: { $ref: "#/components/schemas/Discount" }
        discountAmount: { type: number }
        message: { type: ["string", "null"] }
      required: [valid, discountAmount]

    # Admin stats
    AdminStats:
      type: object
      properties:
        totalRevenue: { type: number }
        totalOrders: { type: integer }
        totalProducts: { type: integer }
        totalUsers: { type: integer }
        revenueGrowth: { type: number }
        ordersGrowth: { type: number }
        pendingOrders: { type: integer }
        processingOrders: { type: integer }
        shippedOrders: { type: integer }
        deliveredOrders: { type: integer }
      required: [totalRevenue, totalOrders, totalProducts, totalUsers, revenueGrowth, ordersGrowth, pendingOrders, processingOrders, shippedOrders, deliveredOrders]

    SalesChartPoint:
      type: object
      properties:
        date: { type: string }
        revenue: { type: number }
        orders: { type: integer }
      required: [date, revenue, orders]

    # Shipping
    TrackingInfo:
      type: object
      properties:
        trackingCode: { type: string }
        status: { type: string }
        statusFa: { type: string }
        carrier: { type: ["string", "null"] }
        estimatedDelivery: { type: ["string", "null"] }
        events: { type: array, items: { $ref: "#/components/schemas/TrackingEvent" } }
      required: [trackingCode, status, statusFa, events]

    TrackingEvent:
      type: object
      properties:
        timestamp: { type: string }
        status: { type: string }
        statusFa: { type: string }
        location: { type: ["string", "null"] }
      required: [timestamp, status, statusFa]

    ShippingMethod:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        nameFa: { type: string }
        price: { type: number }
        estimatedDays: { type: integer }
        isFree: { type: boolean }
        minOrderForFree: { type: ["number", "null"] }
      required: [id, name, nameFa, price, estimatedDays, isFree]
